<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SAINT3V - October 23rd</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ==========================
   COLORS, FONTS, AND RADII
========================== */
:root {
  --panel: rgba(255, 255, 255, 0.05);  /* semi-transparent panel background */
  --text: #f0f0f8;                     /* main text color */
  --muted: #c0c0d0;                     /* lighter text for subtitles */
  --accent: #a1c4fd;                    /* highlight color */
  --radius: 12px;                       /* rounded corners */
  --font-main: 'Arial', sans-serif;     /* main font */
}

/* ==========================
   BASIC PAGE STYLES
========================== */
* { box-sizing: border-box; margin:0; padding:0; }

body {
  font-family: var(--font-main);
  color: var(--text);
  min-height: 100vh;
  position: relative;
  background: #1e1e2e;  /* dark background */
  overflow-x: hidden;
}

.scroll-wrapper {
  display: flex;
  justify-content: center;
  width: 100%;
  min-height: 100vh;
  overflow-y: auto;
}

.container {
  width: 100%;
  max-width: 480px;
  padding: 30px 20px;
  text-align: center;
  position: relative;
  z-index: 1;
}

/* ==========================
   BACKGROUND GRADIENT ANIMATION
========================== */
body::before {
   pointer-events: none;
   content: '';
   position: absolute;
   inset: 0;
   background: linear-gradient(135deg,
      #0d0d1a 0%, #0d0d1a 15%, #1e1e2e 22%,
      #2c2c3e 48%, #7a7aa0 50%, #1e1e2e 52%,
      #0d0d1a 60%, #1e1e2e 70%, #3a3a4e 82%, 
      #0b0b1f 89%, #0d0d1a 95%, #0d0d1a 100%
   );
   background-size: 800% 800%;
   z-index: 0;
   animation: gradientLoop 33s linear infinite;
}

@keyframes gradientLoop {
  0% { background-position: 0% 0%; }
  100% { background-position: 100% 100%; }
}

/* ==========================
   PARTICLES
========================== */
.particles {
  position: absolute;
  inset: 0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}

.particle {
  position:absolute;
  width:5px;
  height:5px;
  background: rgba(161,196,253,0.5);
  border-radius:50%;
  animation: floatParticle linear infinite;
}

@keyframes floatParticle {
  0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
  10% { opacity:1; }
  100% { transform: translateY(-10vh) scale(1); opacity:0; }
}

/* ==========================
   PAGE TITLE
========================== */
h1 {
  font-weight:500;
  font-size:1.8rem;
  margin-bottom:20px;
  letter-spacing:0.6px;
  color:#eaf2ff;
  text-shadow: 0 0 6px rgba(161,196,253,0.6),
               0 0 14px rgba(161,196,253,0.4),
               0 0 30px rgba(161,196,253,0.15);
}

/* ==========================
   ALBUM COVER FLOATING EFFECT
========================== */
.album-visualizer {
  position: relative;
  width: 100%;
  max-width: 360px;
  margin: 0 auto 25px;
}

.album-cover {
  width: 100%;
  border-radius: var(--radius);
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  animation: floatCover 6s ease-in-out infinite;
}

.album-cover:hover {
  transform: scale(1.03);
  box-shadow: 0 12px 28px rgba(0,0,0,0.45);
}

@keyframes floatCover {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}


/* ==========================
   SHOOTING STARS
========================== */
.shooting-stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.shooting-star {
  position: absolute;
  width: 2px;
  height: 80px;
  background: linear-gradient(135deg, rgba(255,255,255,1), rgba(255,255,255,0));
  opacity: 0;
  transform: rotate(45deg) translateX(0) translateY(0);
  animation: shoot 2s linear forwards;
}

@keyframes shoot {
  0% {
    opacity: .95;
    transform: translateX(0) translateY(0) rotate(45deg) scaleX(0.5);
  }
  100% {
    opacity: 0;
    transform: translateX(800px) translateY(600px) rotate(45deg) scaleX(1);
  }
}


   
/* ==========================
   TRACKS STYLE
========================== */
.track {
  background: var(--panel);
  border-radius: var(--radius);
  padding:20px;
  margin-bottom:20px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.track[data-vibe="street"] { border-left:2px solid rgba(120,160,255,0.35); }
.track:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(0,0,0,0.5); }

.track-title { font-size:1rem; color:var(--muted); margin-bottom:12px; }

audio {
  width:100%;
  outline:none;
  border-radius:10px;
  filter: invert(90%) sepia(5%) saturate(15%) hue-rotate(190deg);
}

/* ==========================
   STREET MODE BACKGROUND
========================== */
body.street::before {
  background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
              url("graffiti-bg.jpg");
  background-size: cover;
  background-position:center;
  animation:none;
}

body.street h1 {
  color:#dbe7ff;
  text-shadow: 0 0 4px rgba(120,160,255,0.4),
               0 0 10px rgba(120,160,255,0.2);
}

body.street .particle { background: rgba(200,200,200,0.2); }

/* ==========================
   LINKS & FOOTER
========================== */
#experimental-link, #back-link { 
  font-size:0.85rem; color:var(--muted); 
  margin-bottom:15px; cursor:pointer; text-decoration:underline; 
}

#experimental-link:hover, #back-link:hover { color: var(--accent); }

#chavo-track, #kitties-track, #go-girl-track, #back-link { display: none; }

/*====================================
   ===============================
   GHOOST COUNTER
   ==============================
   ================================*/
.ghost-counter {
  position: fixed;
  bottom: 10px;
  right: 12px;
  opacity: 1;             /* fully visible */
  transform: scale(1);    /* normal size */
  pointer-events: auto;   /* now you can hover/click if needed */
  z-index: 9999;          /* ensures it’s above everything */
}

   
footer { margin-top:30px; font-size:0.75rem; color:var(--muted); opacity:0.7; }
</style>
</head>

<body>

<!-- PARTICLES -->
<div class="particles"></div>

<div class="scroll-wrapper">
  <div class="container">

    <!-- PAGE TITLE -->
    <h1 id="site-title">SAINT3V - October 23rd (Unreleased Demo)</h1>

    <!-- ALBUM COVER -->
    <div class="album-visualizer">
      <img id="album-cover" src="oct23coverart.jpeg" alt="October 23rd Album Cover" class="album-cover">
    </div>

    <!-- TRACKS -->
    <div class="track" id="oct23-track" data-vibe="ethereal">
      <div class="track-title">October 23rd (Unreleased Demo)</div>
      <audio controls preload="none">
        <source src="October_23rdmp3.mp3" type="audio/mpeg">
      </audio>
    </div>

    <div class="track" id="kitties-track" data-vibe="ethereal-override">
      <div class="track-title">I volunteered to rehab abandoned kitties-i don't(i do)</div>
      <audio controls preload="none">
        <source src="v3i_volounteered_to_rehab_adopted_kitties.mp3" type="audio/mpeg">
      </audio>
    </div>

    <div class="track" id="go-girl-track" data-vibe="street">
      <div class="track-title">Go Girl (Unreleased Freestyle Demo)</div>
      <audio controls preload="none">
        <source src="go_girl_freestylemp3.mp3" type="audio/mpeg">
      </audio>
    </div>
     
    <div class="track" id="chavo-track" data-vibe="street">
      <div class="track-title">Chavo Del Seis</div>
      <audio controls preload="none">
        <source src="Chavo_del_sietemp3.m4a" type="audio/mpeg">
      </audio>
    </div>  
     

    <!-- LINKS TO SWITCH TRACKS -->
    <div id="experimental-link">Experimental Tracks</div>
    <div id="back-link">Back to Main Tracks</div>

    <footer>
      © 2025 SAINT3V | Indie Rock Artist / Rapper
      <div>Making music while I'm still here.</div>
    </footer>

  </div>
</div>

<!-- VISITOR COUNTER -->
<div class="ghost-counter">
  <img src="https://hitscounter.dev/api/hit?url=https%3A%2F%2Fsdvantage.com%2F&label=Visitors&icon=person-raised-hand&color=%233d8bfd&style=plastic&tz=US%2FPacific">
</div>

<div class="shooting-stars"></div>

   
</body>
   
<script>
/* ==========================
   CREATE FLOATING PARTICLES
========================== */
const particleContainer = document.querySelector('.particles');

for (let i = 0; i < 50; i++) {
  const particle = document.createElement('div'); // create div
  particle.className = 'particle';

  // set random size
  const size = Math.random() * 4 + 2; // 2-6px
  particle.style.width = size + 'px';
  particle.style.height = size + 'px';

  // set random horizontal position
  particle.style.left = Math.random() * 100 + '%';

  // set random speed and delay
  particle.style.animationDuration = (5 + Math.random() * 10) + 's';
  particle.style.animationDelay = Math.random() * 10 + 's';

  particleContainer.appendChild(particle);
}

/*===========================================
Shooting stars
================================*/


const shootingStarsContainer = document.querySelector('.shooting-stars');

function spawnShootingStar() {
  const star = document.createElement('div');
  star.className = 'shooting-star';

  // random starting position
  star.style.top = Math.random() * 80 + '%';
  star.style.left = Math.random() * 100 + '%';

  // random animation duration
  const duration = 1.5 + Math.random() * 1.5; // 1.5s to 3s
  star.style.animationDuration = duration + 's';

  shootingStarsContainer.appendChild(star);

  // remove after animation ends
  star.addEventListener('animationend', () => star.remove());
}

// spawn a shooting star every 2-4 seconds randomly
setInterval(() => {
  if (Math.random() < 0.6) spawnShootingStar(); // 60% chance
}, 2000);

   
/* ==========================
   TRACK PLAY & VIBE SWITCHING
========================== */
const tracks = document.querySelectorAll('.track audio');
const siteTitle = document.getElementById('site-title');
const defaultTitle = siteTitle.textContent;

// Change background "vibe" when a track plays
function updateVibeOnPlay(audio) {
  const track = audio.closest('.track');
  const vibe = track.dataset.vibe;

  if (vibe === 'street') {
    document.body.classList.add('street');
  } else {
    document.body.classList.remove('street');
  }
}

// Update title and vibe when track is paused
function updateVibeOnPause() {
  const playingTrack = [...tracks].find(a => !a.paused);
  if (!playingTrack) return;
  const vibe = playingTrack.closest('.track').dataset.vibe;
  if (vibe === 'street') document.body.classList.add('street');
  else document.body.classList.remove('street');
}

// Track event listeners
tracks.forEach(audio => {
  audio.addEventListener('play', () => {
    // Pause other tracks
    tracks.forEach(a => { if (a !== audio) a.pause(); });

    // Update page title
    const trackName = audio.closest('.track').querySelector('.track-title').textContent;
    siteTitle.textContent = 'SAINT3V - ' + trackName;

    // Update vibe
    updateVibeOnPlay(audio);

    // Media session (optional)
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: trackName,
        artist: 'SAINT3V',
        album: 'October 23rd',
        artwork: [{ src: 'oct23coverart.jpeg', sizes: '512x512', type: 'image/jpeg' }]
      });
      navigator.mediaSession.setActionHandler('play', () => audio.play());
      navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    }
  });

  audio.addEventListener('pause', () => {
    const allPaused = [...tracks].every(a => a.paused);
    if (allPaused) siteTitle.textContent = defaultTitle;
    updateVibeOnPause();
  });
});

/* ==========================
   SWITCH BETWEEN MAIN & EXPERIMENTAL TRACKS
========================== */
const oct23Track = document.getElementById('oct23-track');
const goGirlTrack = document.getElementById('go-girl-track');
const kittiesTrack = document.getElementById('kitties-track');
const chavoTrack = document.getElementById('chavo-track');
const experimentalLink = document.getElementById('experimental-link');
const backLink = document.getElementById('back-link');

experimentalLink.addEventListener('click', () => {
  document.body.classList.add('street');
  siteTitle.textContent = 'SAINT3V — Experimental Tracks';
  oct23Track.style.display = 'none';
  kittiesTrack.style.display = 'block';
  goGirlTrack.style.display = 'block';
  chavoTrack.style.display = 'block'; 
   
  experimentalLink.style.display = 'none';
  backLink.style.display = 'block';
});

backLink.addEventListener('click', () => {
  document.body.classList.remove('street');
  siteTitle.textContent = defaultTitle;
  oct23Track.style.display = 'block';
  kittiesTrack.style.display = 'none';
  goGirlTrack.style.display = 'none';
  chavoTrack.style.display = 'none'; 
  backLink.style.display = 'none';
  experimentalLink.style.display = 'block';
});
</script>

</body>
</html>
