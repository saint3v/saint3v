<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SAINT3V - October 23rd</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ==========================
   ROOT VARIABLES
========================== */
:root {
  --panel: rgba(255, 255, 255, 0.05);
  --text: #f0f0f8;
  --muted: #c0c0d0;
  --accent: #a1c4fd;
  --radius: 12px;
  --font-main: 'Arial', sans-serif;
}

/* ==========================
   GLOBAL STYLES
========================== */
* { box-sizing: border-box; margin:0; padding:0; }

body {
  font-family: var(--font-main);
  color: var(--text);
  min-height: 100vh;
  position: relative;
  background: #1e1e2e;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* Scroll wrapper */
.scroll-wrapper {
   display: flex;
   justify-content: center;
   width: 100%;
   min-height: 100vh;
   overflow-y: auto;
   overflow-x: hidden;
   -webkit-overflow-scrolling: touch;
}

/* Main container */
.container {
  width: 100%;
  max-width: 480px;
  padding: 30px 20px;
  text-align: center;
  position: relative;
  z-index: 1;
}

/* BACKGROUND GRADIENT */
body::before {
   pointer-events: none;
   content: '';
   position: absolute;
   inset: 0;
   background: linear-gradient(135deg,
      #0d0d1a 0%, #0d0d1a 15%, #1e1e2e 25%, #2c2c3e 48%,
      #7a7aa0 50%, #1e1e2e 52%,
      #0d0d1a 60%, #1e1e2e 70%, #3a3a4e 82%, #0b0b1f 89%, #0b0b1f 100%
   );
   background-size: 400% 400%;
   z-index: 0;
   animation: gradientShift 34s linear infinite;
}

@keyframes gradientShift {
   0%   { background-position: 0% 0%; }
   50%  { background-position: 100% 100%; }
   100% { background-position: 0% 0%; }
}

/* PARTICLES */
.particles {
  position: absolute;
  inset: 0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}

.particle {
  position:absolute;
  width:5px;
  height:5px;
  background: rgba(161,196,253,0.5);
  border-radius:50%;
  animation: floatParticle linear infinite;
}

@keyframes floatParticle {
  0% { transform: translateY(100vh) scale(0.5); opacity: 0;}
  10% { opacity:1;}
  100% { transform: translateY(-10vh) scale(1); opacity:0;}
}

/* TITLE */
h1 {
  font-weight:500;
  font-size:1.8rem;
  margin-bottom:20px;
  letter-spacing:0.6px;
  line-height:1.25;
  color:#eaf2ff;
  text-shadow: 0 0 6px rgba(161,196,253,0.6),
               0 0 14px rgba(161,196,253,0.4),
               0 0 30px rgba(161,196,253,0.15);
}

/* ALBUM COVER */
.album-cover {
  width: 100%;
  max-width: 360px;
  border-radius: var(--radius);
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  margin: 0 auto 25px;
  display: block;
}

/* TRACKS */
.track {
  background: var(--panel);
  border-radius: var(--radius);
  padding:20px;
  margin-bottom:20px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
}

.track[data-vibe="street"] {
  border-left:2px solid rgba(120,160,255,0.35);
}

.track-title {
  font-size:1rem;
  color:var(--muted);
  margin-bottom:12px;
}

audio {
  width:100%;
  outline:none;
  border-radius:10px;
  filter: invert(90%) sepia(5%) saturate(15%) hue-rotate(190deg);
}

/* STREET MODE */
body.street::before {
  background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url("graffiti-bg.jpg");
  background-size: cover;
  background-position:center;
  animation:none;
}

body.street .track[data-vibe="street"] {
  border-left:2px solid rgba(200,200,200,0.2);
}

/* LINKS / FOOTER */
#experimental-link, #back-link {
  font-size:0.85rem;
  color:var(--muted);
  margin-bottom:15px;
  cursor:pointer;
  text-decoration:underline;
}

#experimental-link:hover, #back-link:hover { color: var(--accent); }
#go-girl-track, #back-link { display: none; }

footer {
  margin-top:30px;
  font-size:0.75rem;
  color:var(--muted);
  opacity:0.7;
}

/* VISITOR COUNTER */
.ghost-counter {
  position:fixed;
  bottom:10px;
  right:12px;
  opacity:0.35;
  transform:scale(0.55);
  transform-origin:bottom right;
  pointer-events:none;
  z-index:2;
}

.ghost-counter img {
  filter: grayscale(60%) brightness(1)
         drop-shadow(0 0 6px rgba(161,196,253,0.35))
         drop-shadow(0 0 14px rgba(161,196,253,0.15));
}
</style>
</head>

<body>

<!-- PARTICLES -->
<div class="particles"></div>

<div class="scroll-wrapper">
  <div class="container">

    <h1 id="site-title">SAINT3V - October 23rd (Unreleased Demo)</h1>

    <!-- ALBUM COVER -->
    <img id="album-cover" src="oct23coverart.jpeg" alt="October 23rd Album Cover" class="album-cover">

    <!-- TRACKS -->
    <div class="track" id="oct23-track" data-vibe="ethereal">
      <div class="track-title">October 23rd (Unreleased Demo)</div>
      <audio controls preload="none">
        <source src="October_23rdmp3.mp3" type="audio/mpeg">
      </audio>
    </div>

    <div class="track" id="go-girl-track" data-vibe="street">
      <div class="track-title">Go Girl (Unreleased Freestyle Demo)</div>
      <audio controls preload="none">
        <source src="go_girl_freestylemp3.mp3" type="audio/mpeg">
      </audio>
    </div>

    <!-- LINKS -->
    <div id="experimental-link">Experimental Tracks</div>
    <div id="back-link">Back to Main Tracks</div>

    <footer>
      © 2025 SAINT3V | Indie Rock Artist / Rapper
      <div>Making music while i'm still here.</div>
    </footer>

  </div>
</div>

<!-- VISITOR COUNTER -->
<div class="ghost-counter">
  <img src="https://hitscounter.dev/api/hit?url=https%3A%2F%2Fsdvantage.com%2F&label=Visitors&icon=person-raised-hand&color=%233d8bfd&style=plastic&tz=US%2FPacific">
</div>

<script>
/* ==========================
   PARTICLES
========================== */
const particleContainer = document.querySelector('.particles');
for (let i = 0; i < 50; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  const size = Math.random() * 4 + 2;
  p.style.width = size + 'px';
  p.style.height = size + 'px';
  p.style.left = Math.random() * 100 + '%';
  p.style.animationDuration = 5 + Math.random() * 10 + 's';
  p.style.animationDelay = Math.random() * 10 + 's';
  particleContainer.appendChild(p);
}

/* ==========================
   AUDIO & MEDIA SESSION
========================== */
const tracks = document.querySelectorAll('.track audio');
const siteTitle = document.getElementById('site-title');
const defaultTitle = siteTitle.textContent;

tracks.forEach(audio => {
  audio.addEventListener('play', () => {
    // Pause other tracks
    tracks.forEach(a => { if (a !== audio) a.pause(); });

    const title = audio.closest('.track').querySelector('.track-title').textContent;
    siteTitle.textContent = 'SAINT3V - ' + title;

    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title, artist: 'SAINT3V', album: 'October 23rd',
        artwork: [{ src: 'oct23coverart.jpeg', sizes:'512x512', type:'image/jpeg'}]
      });
      navigator.mediaSession.setActionHandler('play', () => audio.play());
      navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    }
  });

  audio.addEventListener('pause', () => {
    const allPaused = [...tracks].every(a => a.paused);
    if (allPaused) siteTitle.textContent = defaultTitle;
  });
});

/* ==========================
   EXPERIMENTAL / MAIN TOGGLE
========================== */
const oct23Track = document.getElementById('oct23-track');
const goGirlTrack = document.getElementById('go-girl-track');
const experimentalLink = document.getElementById('experimental-link');
const backLink = document.getElementById('back-link');

experimentalLink.addEventListener('click', () => {
  document.body.classList.add('street');
  siteTitle.textContent = 'SAINT3V — Experimental Tracks';
  oct23Track.style.display = 'none';
  goGirlTrack.style.display = 'block';
  experimentalLink.style.display = 'none';
  backLink.style.display = 'block';
});

backLink.addEventListener('click', () => {
  document.body.classList.remove('street');
  siteTitle.textContent = defaultTitle;
  oct23Track.style.display = 'block';
  goGirlTrack.style.display = 'none';
  backLink.style.display = 'none';
  experimentalLink.style.display = 'block';
});
</script>

</body>
</html>
